service: serverless-felix

frameworkVersion: '3'

provider:
  name: google
  stage: ${opt:stage, 'dev'}
  runtime: nodejs20
  region: us-central1
  project: ${self:custom.projects.${self:provider.stage}}
  credentials: ${env:GCP_KEYFILE_PATH, '~/.gcloud/keyfile.json'}

plugins:
  - serverless-google-cloudfunctions
  - serverless-plugin-typescript

custom:
  projects:
    dev: serverless-felix-dev
    prd: serverless-felix-prd

functions:
  hello:
    handler: src/functions/hello/handler.hello
    events:
      - http: path

package:
  exclude:
    - node_modules/**
    - .gitignore
    - .git/**
