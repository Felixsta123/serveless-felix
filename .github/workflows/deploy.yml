name: Deploy

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed deploy targets
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared_functions:
              - 'src/functions/shared/**'
              - 'src/index.ts'
            backend_dependencies:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.gcloudignore'
            discord_proxy:
              - 'src/functions/proxies/discordProxy/**'
            web_proxy:
              - 'src/functions/proxies/webProxy/**'
            oauth_proxy:
              - 'src/functions/proxies/oauthProxy/**'
            worker_draw:
              - 'src/functions/workers/workerDraw/**'
            worker_snapshot:
              - 'src/functions/workers/workerSnapshot/**'
            worker_discord:
              - 'src/functions/workers/workerDiscord/**'
            worker_oauth:
              - 'src/functions/workers/workerOAuth/**'
            worker_webread:
              - 'src/functions/workers/workerWebRead/**'
            gateway:
              - 'gateway/openapi.template.yaml'
              - 'scripts/deploy-gateway.mjs'
            monitoring:
              - 'monitoring/**'
              - 'scripts/deploy-monitoring.mjs'
              - 'scripts/deploy-alerts.mjs'
            reliability:
              - 'scripts/deploy-reliability.mjs'
            ttl:
              - 'scripts/deploy-ttl.mjs'
            web:
              - 'web/**'

      - name: Build deploy plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || echo "$HEAD_SHA")"
          fi

          functions=()
          force_all=false

          if [[ "${{ steps.changes.outputs.shared_functions }}" == "true" ]]; then
            force_all=true
          fi

          if [[ "${{ steps.changes.outputs.backend_dependencies }}" == "true" ]]; then
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- package-lock.json tsconfig.json .gcloudignore | grep -q .; then
              force_all=true
            fi

            if [[ "$force_all" == "false" ]] && git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- package.json | grep -q .; then
              package_affects_functions=$(BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" node scripts/ci/package-affects-functions.mjs)
              if [[ "$package_affects_functions" == "true" ]]; then
                force_all=true
              fi
            fi
          fi

          if [[ "$force_all" == "true" ]]; then
            functions=(discordProxy webProxy oauthProxy workerDraw workerSnapshot workerDiscord workerOAuth workerWebRead)
          else
            [[ "${{ steps.changes.outputs.discord_proxy }}" == "true" ]] && functions+=(discordProxy)
            [[ "${{ steps.changes.outputs.web_proxy }}" == "true" ]] && functions+=(webProxy)
            [[ "${{ steps.changes.outputs.oauth_proxy }}" == "true" ]] && functions+=(oauthProxy)
            [[ "${{ steps.changes.outputs.worker_draw }}" == "true" ]] && functions+=(workerDraw)
            [[ "${{ steps.changes.outputs.worker_snapshot }}" == "true" ]] && functions+=(workerSnapshot)
            [[ "${{ steps.changes.outputs.worker_discord }}" == "true" ]] && functions+=(workerDiscord)
            [[ "${{ steps.changes.outputs.worker_oauth }}" == "true" ]] && functions+=(workerOAuth)
            [[ "${{ steps.changes.outputs.worker_webread }}" == "true" ]] && functions+=(workerWebRead)
          fi

          if (( ${#functions[@]} > 0 )); then
            echo "has_functions=true" >> "$GITHUB_OUTPUT"
            echo "functions=${functions[*]}" >> "$GITHUB_OUTPUT"
          else
            echo "has_functions=false" >> "$GITHUB_OUTPUT"
            echo "functions=" >> "$GITHUB_OUTPUT"
          fi

          echo "gateway_changed=${{ steps.changes.outputs.gateway }}" >> "$GITHUB_OUTPUT"
          echo "monitoring_changed=${{ steps.changes.outputs.monitoring }}" >> "$GITHUB_OUTPUT"
          echo "reliability_changed=${{ steps.changes.outputs.reliability }}" >> "$GITHUB_OUTPUT"
          echo "ttl_changed=${{ steps.changes.outputs.ttl }}" >> "$GITHUB_OUTPUT"
          echo "web_changed=${{ steps.changes.outputs.web }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        if: steps.plan.outputs.has_functions == 'true'
        run: npm ci

      - name: Authenticate to Google Cloud
        if: steps.plan.outputs.has_functions == 'true' || steps.plan.outputs.gateway_changed == 'true' || steps.plan.outputs.monitoring_changed == 'true' || steps.plan.outputs.reliability_changed == 'true' || steps.plan.outputs.ttl_changed == 'true' || steps.plan.outputs.web_changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Set GCP Keyfile Path
        if: steps.plan.outputs.has_functions == 'true' || steps.plan.outputs.gateway_changed == 'true' || steps.plan.outputs.monitoring_changed == 'true' || steps.plan.outputs.reliability_changed == 'true' || steps.plan.outputs.ttl_changed == 'true' || steps.plan.outputs.web_changed == 'true'
        run: echo "GCP_KEYFILE_PATH=${{ env.GOOGLE_APPLICATION_CREDENTIALS }}" >> $GITHUB_ENV

      - name: Deploy changed functions to Dev
        if: github.ref == 'refs/heads/dev' && steps.plan.outputs.has_functions == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for fn in ${{ steps.plan.outputs.functions }}; do
            node scripts/deploy.mjs dev "$fn"
          done

      - name: Deploy API Gateway (Dev)
        if: github.ref == 'refs/heads/dev' && steps.plan.outputs.gateway_changed == 'true'
        run: npm run deploy:dev:gateway

      - name: Deploy Monitoring Dashboard (Dev)
        if: github.ref == 'refs/heads/dev' && steps.plan.outputs.monitoring_changed == 'true'
        run: npm run deploy:dev:monitoring

      - name: Deploy Monitoring Alerts (Dev)
        if: github.ref == 'refs/heads/dev' && steps.plan.outputs.monitoring_changed == 'true'
        run: npm run deploy:dev:alerts

      - name: Apply Reliability Hardening (Dev)
        if: github.ref == 'refs/heads/dev' && steps.plan.outputs.reliability_changed == 'true'
        run: npm run deploy:dev:reliability

      - name: Apply Firestore TTL (Dev)
        if: github.ref == 'refs/heads/dev' && steps.plan.outputs.ttl_changed == 'true'
        run: npm run deploy:dev:ttl

      - name: Build Web App (Dev)
        if: github.ref == 'refs/heads/dev' && steps.plan.outputs.web_changed == 'true'
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Deploy Web App (Dev)
        if: github.ref == 'refs/heads/dev' && steps.plan.outputs.web_changed == 'true'
        run: npx --yes firebase-tools deploy --project serverless-felix-dev --only hosting --config web/firebase.json --non-interactive

      - name: Deploy changed functions to Prod
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.has_functions == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for fn in ${{ steps.plan.outputs.functions }}; do
            node scripts/deploy.mjs prd "$fn"
          done

      - name: Deploy API Gateway (Prod)
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.gateway_changed == 'true'
        run: npm run deploy:prd:gateway

      - name: Deploy Monitoring Dashboard (Prod)
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.monitoring_changed == 'true'
        run: npm run deploy:prd:monitoring

      - name: Deploy Monitoring Alerts (Prod)
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.monitoring_changed == 'true'
        run: npm run deploy:prd:alerts

      - name: Apply Reliability Hardening (Prod)
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.reliability_changed == 'true'
        run: npm run deploy:prd:reliability

      - name: Apply Firestore TTL (Prod)
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.ttl_changed == 'true'
        run: npm run deploy:prd:ttl

      - name: Build Web App (Prod)
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.web_changed == 'true'
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Deploy Web App (Prod)
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.web_changed == 'true'
        run: npx --yes firebase-tools deploy --project serverless-felix-prd --only hosting --config web/firebase.json --non-interactive
