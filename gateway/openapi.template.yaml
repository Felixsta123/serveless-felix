swagger: '2.0'
info:
  title: serverless-felix
  description: API Gateway for serverless-felix
  version: 1.0.0
schemes:
  - https
produces:
  - application/json
securityDefinitions:
  gateway_api_key:
    type: apiKey
    name: key
    in: query
paths:
  /discord:
    post:
      summary: Discord interactions proxy
      operationId: discordPost
      x-google-backend:
        address: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/discordProxy
        path_translation: CONSTANT_ADDRESS
        jwt_audience: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/discordProxy
      responses:
        '200':
          description: OK
  /web/{path}:
    get:
      summary: Web proxy with path
      operationId: webGetPath
      security:
        - gateway_api_key: []
      parameters:
        - name: path
          in: path
          required: true
          type: string
      x-google-backend:
        address: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/webProxy
        path_translation: APPEND_PATH_TO_ADDRESS
        jwt_audience: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/webProxy
      responses:
        '200':
          description: OK
    post:
      summary: Web proxy with path
      operationId: webPostPath
      security:
        - gateway_api_key: []
      parameters:
        - name: path
          in: path
          required: true
          type: string
      x-google-backend:
        address: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/webProxy
        path_translation: APPEND_PATH_TO_ADDRESS
        jwt_audience: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/webProxy
      responses:
        '200':
          description: OK
    options:
      summary: Web proxy CORS preflight
      operationId: webOptionsPath
      parameters:
        - name: path
          in: path
          required: true
          type: string
      x-google-backend:
        address: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/webProxy
        path_translation: APPEND_PATH_TO_ADDRESS
        jwt_audience: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/webProxy
      responses:
        '204':
          description: No Content
  /web/request/{requestId}:
    get:
      summary: Web proxy request status
      operationId: webGetRequestStatus
      security:
        - gateway_api_key: []
      parameters:
        - name: requestId
          in: path
          required: true
          type: string
      x-google-backend:
        address: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/webProxy
        path_translation: APPEND_PATH_TO_ADDRESS
        jwt_audience: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/webProxy
      responses:
        '200':
          description: OK
    options:
      summary: Web proxy request status CORS preflight
      operationId: webOptionsRequestStatus
      parameters:
        - name: requestId
          in: path
          required: true
          type: string
      x-google-backend:
        address: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/webProxy
        path_translation: APPEND_PATH_TO_ADDRESS
        jwt_audience: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/webProxy
      responses:
        '204':
          description: No Content
  /oauth:
    get:
      summary: OAuth proxy
      operationId: oauthGet
      x-google-backend:
        address: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/oauthProxy
        path_translation: CONSTANT_ADDRESS
        jwt_audience: https://{{REGION}}-{{PROJECT_ID}}.cloudfunctions.net/oauthProxy
      responses:
        '200':
          description: OK
